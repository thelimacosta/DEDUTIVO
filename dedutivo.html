<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dedutivo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTEiIGZpbGw9IiMwZjEyMTgiLz48Y2lyY2xlIGN4PSIyMCIgY3k9IjIwIiByPSIxMiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZjBiODRhIiBzdHJva2Utd2lkdGg9IjMuNSIvPjxwYXRoIGQ9Ik0yOSAyOWwxMiAxMiIgc3Ryb2tlPSIjZjBiODRhIiBzdHJva2Utd2lkdGg9IjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxwYXRoIGQ9Ik0xNCAyMGgxMk0yMCAxNHYxMiIgc3Ryb2tlPSIjZjBiODRhIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PC9zdmc+">
<meta name="theme-color" content="#0f1218">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Dedutivo: jogo de detetive com lógica matemática.">
<style>
:root{--bg:#0f1218;--card:#1a1f2a;--card2:#212736;--line:#2d3547;--ink:#ece8dc;--mute:#9aa3b5;--amber:#f0b84a;--green:#5cc08e;--red:#e2645d;--r:14px}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(900px 500px at 15% -10%,#222b3f 0,transparent 60%),radial-gradient(700px 400px at 100% 0,#2a2233 0,transparent 55%),var(--bg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 56px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:42px;height:42px;flex:none}
.brand h1{margin:0;font:700 26px/1 Georgia,"Times New Roman",serif;letter-spacing:.22em;color:var(--amber)}
.brand p{margin:5px 0 0;color:var(--mute);font-size:13px}
.total{color:var(--mute);font-size:14px}
.total b{color:var(--amber);font-size:20px;margin-left:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tab{flex:1 0 auto;min-width:112px;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer;font:inherit;line-height:1.35}
.tab small{display:block;color:var(--mute);font-size:12px}
.tab .st{color:var(--amber);letter-spacing:2px;font-size:12px;min-height:16px;display:block}
.tab.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:16px}
.card h2{margin:0 0 6px;font:700 24px/1.2 Georgia,serif}
.card h3{margin:0 0 10px;font-size:17px;letter-spacing:.02em}
.card h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.card h4 small{text-transform:none;letter-spacing:0}
.kicker{margin:0 0 4px;color:var(--amber);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.mute{color:var(--mute)}
.small{font-size:13px}
.board{display:grid;gap:0 20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.board{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
details.how{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;margin-bottom:16px}
details.how summary{cursor:pointer;font-weight:600}
details.how ul{margin:10px 0 4px;padding-left:20px}
details.how li{margin:4px 0}
.cast{display:grid;gap:14px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
.chips li b{margin-left:8px;padding-left:8px;border-left:1px solid var(--line);color:var(--amber);font-family:ui-monospace,Menlo,Consolas,monospace}
ol.clues{margin:0;padding:0;list-style:none;counter-reset:c}
ol.clues li{counter-increment:c;margin:0 0 8px}
.clue{width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px 9px 40px;font:inherit;cursor:pointer;position:relative}
.clue::before{content:counter(c);position:absolute;left:10px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#1a1405;font-weight:700;font-size:13px;display:grid;place-items:center}
.clue.done{opacity:.5;text-decoration:line-through}
.finalclue{margin-top:10px;border:1px dashed var(--amber);border-radius:10px;padding:10px 12px;background:rgba(240,184,74,.07)}
.finalclue .tag{display:block;color:var(--amber);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.hint{background:var(--card2);border-left:3px solid var(--amber);border-radius:6px;padding:8px 12px;margin:0 0 8px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--amber);background:var(--amber);color:#1a1405}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--amber)}
.btn.sm{padding:5px 11px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:8px}
.toolbar label{font-size:14px;display:flex;gap:8px;align-items:center;cursor:pointer}
.gridblock{margin-top:14px}
.gridwrap{overflow-x:auto;padding-bottom:4px}
table.grid{border-collapse:separate;border-spacing:3px;margin:0}
table.grid th{font-weight:500;font-size:11px;color:var(--mute);text-align:center;padding:2px 2px 4px;min-width:58px;line-height:1.25}
table.grid th[scope=row]{text-align:right;min-width:92px;padding-right:8px;font-size:12.5px;color:var(--ink)}
.lab b{display:block;color:var(--amber);font:600 12px ui-monospace,Menlo,Consolas,monospace}
th[scope=row] .lab b{display:inline;margin-left:6px}
.cell{width:52px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:18px;cursor:pointer;display:block;margin:0 auto}
.cell:hover{border-color:var(--mute)}
.cell.s1{color:var(--red);background:rgba(226,100,93,.1)}
.cell.s2{color:#0d2418;background:var(--green);border-color:var(--green);font-weight:700}
.answer{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0 14px}
.answer label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
select{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px}
.msg{min-height:1.5em;margin:10px 0 0;color:var(--red)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.reveal{border-color:var(--green);background:linear-gradient(180deg,rgba(92,192,142,.1),transparent 60%),var(--card)}
.reveal .kicker{color:var(--green)}
.stars{color:var(--amber);font-size:22px;letter-spacing:4px;margin:4px 0 10px}
.ending{font-style:italic}
.reveal ol{padding-left:22px}
.case-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.refresh{display:inline-flex;align-items:center;gap:8px}
.refresh .ico{display:inline-flex;transition:transform .6s}
.refresh .ico svg{display:block;width:17px;height:17px}
.refresh:hover .ico{transform:rotate(360deg)}
.notes textarea{width:100%;min-height:110px;resize:vertical;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;padding:10px 12px}
.notes summary{cursor:pointer;font-weight:600;color:var(--amber)}
.reveal li{margin:5px 0}
table.sol{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0 14px}
table.sol th,table.sol td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
table.sol tr.k td,table.sol tr.k th{color:var(--green);font-weight:700}
footer{margin-top:28px;text-align:center;color:var(--mute);font-size:13px}
footer button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

header.top{position:sticky;top:0;z-index:20;margin:-4px -12px 14px;padding:10px 12px;background:rgba(15,18,24,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.total{display:flex;align-items:center;gap:6px}
.bar{display:block;width:90px;height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin-left:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--green));transition:width .6s}
.tab.on{background:linear-gradient(180deg,rgba(240,184,74,.12),var(--card))}
.btn{transition:transform .1s,filter .15s}.btn:active{transform:scale(.96)}
.clue{transition:background .15s}.clue:hover{background:#2a3144}
.cell{transition:background .15s,border-color .15s,transform .1s}.cell:active{transform:scale(.9)}
.cell.bad{box-shadow:0 0 0 2px var(--red)}
td.hc .cell.s0,tr.hr .cell.s0{background:rgba(240,184,74,.09);border-color:rgba(240,184,74,.35)}
tr.hr th[scope=row],table.grid thead th.hc{color:var(--amber)}
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin:0 8px 0 -6px;font-size:11px;font-weight:700;color:#10131a;background:hsl(var(--h) 65% 68%)}
.timer{margin-left:auto;margin-right:8px;font:600 14px ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
.pbar{height:4px;border-radius:9px;background:var(--card2);overflow:hidden;margin:2px 0 8px}
.pbar i{display:block;height:100%;background:var(--amber);transition:width .3s}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--amber);color:var(--ink);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:.8}}
.reveal .stars{animation:pop .6s .2s both}
@keyframes pop{50%{transform:scale(1.25)}}
@media(max-width:560px){.brand p{display:none}.bar{width:56px}}

/* ===== v3: layout novo ===== */
.wrap{max-width:1120px}
header.top{margin:-4px -12px 16px}
.total{gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:13px;color:var(--mute)}
.pill b{color:var(--amber);font-size:17px}
.ico{display:inline-flex}.ico svg{width:1.15em;height:1.15em;display:block}
.ico.line svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .ico{margin-right:6px}.btn.refresh .ico{margin-right:0}
.btn:disabled{opacity:.55;cursor:wait}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:760px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvl{display:grid;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;cursor:pointer;font:inherit;transition:border-color .2s,background .2s}
.lvl:hover{border-color:var(--mute)}
.lvl.on{border-color:var(--amber);background:linear-gradient(180deg,rgba(240,184,74,.12),var(--card));box-shadow:0 0 0 1px var(--amber) inset}
.lvl-name{font:700 17px/1.2 Georgia,serif}
.lvl-meta,.lvl-prog{color:var(--mute);font-size:12px}
.dots{display:flex;gap:4px;margin:4px 0 2px}
.dots i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--amber)}
.casehead .case-tools{gap:10px 14px}
.casenav{display:flex;align-items:center;gap:8px}
.casenav .kicker{margin:0}
.casetools-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.iconbtn:disabled{opacity:.35;cursor:default}
.code{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--amber);background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.code.static{cursor:default;color:var(--mute)}
.timer{display:inline-flex;align-items:center;gap:6px;margin:0;font:600 14px ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
.refresh.spin .ico{animation:spin .6s cubic-bezier(.45,0,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}
.intro{margin:6px 0 10px}
details.codebox{margin-top:6px}
details.codebox summary{cursor:pointer;color:var(--mute);font-size:13px}
.codeform{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.codein{background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;padding:6px 10px;width:150px;text-transform:uppercase}
.codemsg{color:var(--red);min-height:1.2em;margin:4px 0 0}
.board{display:grid;gap:0 20px;grid-template-columns:minmax(0,1fr)}
.col-l,.col-r{display:contents}
.cast-card{order:1}.clues-card{order:2}.work-card{order:3}.fichas-card{order:4}.accuse{order:5}.hint-card{order:6}
@media(min-width:980px){
  .board{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
  .col-l,.col-r{display:flex;flex-direction:column;min-width:0}
  .cast-card,.clues-card,.work-card,.fichas-card,.accuse,.hint-card{order:0}
}
.chips.w li b{color:var(--rose,#e58f86)}.chips.r li b{color:var(--blue,#7fb2e5)}
.tk-s{font-weight:700;color:#fff}.tk-w{color:#e58f86;font-weight:600}.tk-r{color:#7fb2e5;font-weight:600}
.num{font:600 .95em ui-monospace,Menlo,Consolas,monospace;color:var(--amber)}
.clue.done .num,.clue.done .tk-s,.clue.done .tk-w,.clue.done .tk-r{color:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.wtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 12px}
.wtab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.wtab[aria-selected=true]{color:var(--amber);border-bottom-color:var(--amber)}
.toolbar .btn{display:inline-flex;align-items:center}
textarea.nt{width:100%;min-height:260px;resize:vertical;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:12px;margin:8px 0}
.qrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.qlab{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;min-width:74px}
.qchip{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:2px 11px;font:inherit;font-size:13px;cursor:pointer}
.qchip:hover{border-color:var(--amber)}
.qchip.w{border-left:3px solid #e58f86}.qchip.r{border-left:3px solid #7fb2e5}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:8px}
.ficha{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fname{font-weight:700;margin-bottom:6px;display:flex;align-items:center}
.frow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.fk{color:var(--mute)}
.fv{text-align:right}.fv.w{color:#e58f86;font-weight:600}.fv.r{color:#7fb2e5;font-weight:600}.fv.none{color:var(--mute)}
.fv em{display:block;font-size:11px;color:var(--mute);font-style:normal}
.ans-group{margin-bottom:12px}
.ans-opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt b{margin-left:8px;padding-left:8px;border-left:1px solid var(--line);color:var(--amber);font-family:ui-monospace,Menlo,Consolas,monospace}
.opt:hover{border-color:var(--mute)}
.opt.on{background:rgba(240,184,74,.16);border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.pbar{margin:4px 0 6px}
/* ===== v4 ===== */
.pill .ico{color:var(--amber)}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.mode{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:12px;padding:10px 8px;font:inherit;font-weight:600;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.mode:hover{color:var(--ink);border-color:var(--mute)}
.mode.on{color:var(--amber);border-color:var(--amber);background:linear-gradient(180deg,rgba(240,184,74,.12),var(--card))}
@media(max-width:620px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}.mode{font-size:14px}}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.cardhead h3{margin:0}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:34px;height:20px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;transition:.2s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:.2s}
.switch input:checked+.knob{background:rgba(240,184,74,.25);border-color:var(--amber)}
.switch input:checked+.knob::after{left:16px;background:var(--amber)}
.switch input:focus-visible+.knob{outline:2px solid var(--amber);outline-offset:2px}
code.fx{display:block;margin-top:5px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#c9b6ff;background:rgba(140,110,255,.08);border-radius:6px;padding:3px 8px;white-space:normal;word-break:break-word}
code.fx.block{margin:0 0 10px}
.clue.done code.fx{color:inherit}
.legend{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);background:var(--card2);border-radius:8px;padding:6px 10px;margin:0 0 10px}
.pic{display:inline-block;flex:none;width:44px;height:44px;border-radius:10px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.pic svg{display:block;width:100%;height:100%}
.pic.sm{width:28px;height:28px;border-radius:7px;margin-right:8px}
.pic.xs{width:22px;height:22px;border-radius:6px;margin:-2px 8px -2px -4px;vertical-align:middle}
.pic.lg{width:84px;height:84px;border-radius:16px}
.people{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.people li{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.people b{display:block;font-size:15px}.bio{display:block;font-size:12px;color:var(--mute);line-height:1.35}
.stmt-card .rule{margin:0 0 10px;font-size:14px}
.stmts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stmts li{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.sbody{flex:1;min-width:0}.sbody b{display:block;font-size:14px}
.sbody q{display:block;font-style:italic;margin-top:2px}
.tv{flex:none;font:600 12px/1 system-ui,sans-serif;border-radius:999px;padding:6px 10px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;min-width:70px}
.tv.t1{color:#0d2418;background:var(--green);border-color:var(--green)}
.tv.t2{color:#fff;background:var(--red);border-color:var(--red)}
.hint .tier{display:inline-block;font:600 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-right:8px}

function permutations(n){
  const res=[], a=[...Array(n).keys()];
  (function p(k){
    if(k===n){ res.push(a.slice()); return; }
    for(let i=k;i<n;i++){ [a[k],a[i]]=[a[i],a[k]]; p(k+1); [a[k],a[i]]=[a[i],a[k]]; }
  })(0);
  return res;
}

const PN=b=>b?"par":"ímpar";
function atom(R,x,i,want,onlyWR){
  const N=x.N[i],T=x.T[i],k=onlyWR?ri(R,0,1):ri(R,0,3);
  if(k===0){const w=want===true?x.W.find(o=>o.v===T.w):want===false?pickOf(R,x.W.filter(o=>o.v!==T.w)):pickOf(R,x.W);
    return{t:`${N} usou ${art(w)}`,nt:`${N} não usou ${art(w)}`,fx:`Arma(${N}, ${w.n})`,nfx:`¬Arma(${N}, ${w.n})`,f:S=>S[i].w===w.v};}
  if(k===1){const r=want===true?x.Rm.find(o=>o.v===T.r):want===false?pickOf(R,x.Rm.filter(o=>o.v!==T.r)):pickOf(R,x.Rm);
    return{t:`${N} esteve ${prep(r)}`,nt:`${N} não esteve ${prep(r)}`,fx:`Local(${N}, ${r.n})`,nfx:`¬Local(${N}, ${r.n})`,f:S=>S[i].r===r.v};}
  if(k===2){const ev=T.w%2===0,par=want===null?R()<.5:(want?ev:!ev);
    return{t:`a arma de ${N} tem peso ${PN(par)}`,nt:`a arma de ${N} tem peso ${PN(!par)}`,fx:`${PN(par)}(p(${N}))`,nfx:`${PN(!par)}(p(${N}))`,f:S=>(S[i].w%2===0)===par};}
  const ev=T.r%2===0,par=want===null?R()<.5:(want?ev:!ev);
  return{t:`${N} esteve num cômodo de número ${PN(par)}`,nt:`${N} esteve num cômodo de número ${PN(!par)}`,fx:`${PN(par)}(n(${N}))`,nfx:`${PN(!par)}(n(${N}))`,f:S=>(S[i].r%2===0)===par};
}
function lit(R,x,i,want){
  const neg=R()<.3,a=atom(R,x,i,want===null?null:(neg?!want:want));
  const L=neg?{t:a.nt,nt:a.t,fx:a.nfx,nfx:a.fx,f:S=>!a.f(S)}:{t:a.t,nt:a.nt,fx:a.fx,nfx:a.nfx,f:a.f};
  L.v=L.f(x.T);return L;
}

function genClue(R,x,mix,kinds,tot){
  let v=R()*tot,kind=kinds[0];
  for(const k of kinds){v-=mix[k];if(v<0){kind=k;break;}}
  const i=ri(R,0,x.n-1);let j=ri(R,0,x.n-2);if(j>=i)j++;
  let k=-1;if(x.n>=3){const rest=[...Array(x.n).keys()].filter(m=>m!==i&&m!==j);k=pickOf(R,rest);}
  const cl=TPL[kind](R,x,i,j,k);
  return cl&&cl.f(x.T)?cl:null;
}
function culpritIn(kf,S){let k=-1;for(let i=0;i<S.length;i++)if(kf(S[i],S)){if(k>=0)return -1;k=i;}return k;}

// opts (opcional): {mix, theme, focus:[tipos], need, liar, max}
function tryGenerate(L,R,relaxed,opts){
  const th=opts&&opts.theme!=null?THEMES[opts.theme]:pickOf(R,THEMES),n=L.n;
  const sus=sampleOf(R,NAMES,n).sort((a,b)=>a.localeCompare(b,"pt"));
  const wv=sortedSample(R,L.w[0],L.w[1],n),rv=L.r?sortedSample(R,L.r[0],L.r[1],n):[...Array(n).keys()].map(i=>i+1);
  const W=sampleOf(R,th.W,n).map((it,i)=>({n:it.n,g:it.g,v:wv[i]}));
  const Rm=sampleOf(R,th.R,n).map((it,i)=>({n:it.n,g:it.g,v:rv[i]}));
  const pw=shuffled(R,[...Array(n).keys()]),pr=shuffled(R,[...Array(n).keys()]);
  const T=pw.map((w,i)=>({w:W[w].v,r:Rm[pr[i]].v}));
  const ks=KILLERS.filter(k=>k.tier<=L.kt).map(k=>({k,m:T.map((p,i)=>k.f(p,T)?i:-1).filter(i=>i>=0)})).filter(o=>o.m.length===1);
  if(!ks.length)return null;
  const ko=pickOf(R,ks);
  let ST=buildStates({suspects:sus,weapons:W,rooms:Rm}).map(s=>s.S);
  const mix=opts&&opts.mix?Object.assign({},L.mix,opts.mix):L.mix;
  const x={n,N:sus,W,Rm,T},kinds=Object.keys(mix),tot=kinds.reduce((a,k)=>a+mix[k],0);
  // ---- depoimentos: o culpado mente, os demais dizem a verdade ----
  let base=null,stmts=null;
  if(opts&&opts.liar){
    const kc=ko.m[0];stmts=[];
    for(let i=0;i<n;i++){
      let st=null;
      for(let t=0;t<120&&!st;t++){
        if(i!==kc){const cl=genClue(R,x,mix,kinds,tot);if(cl&&cl.who.length&&!cl.who.includes(i))st=cl;}
        else{const Tp=ST[Math.floor(R()*ST.length)];const cl=genClue(R,{n,N:sus,W,Rm,T:Tp},mix,kinds,tot);if(cl&&cl.who.length&&!cl.who.includes(i)&&!cl.f(T))st=cl;}
      }
      if(!st)return null;
      stmts.push({by:i,t:st.t,fx:st.fx,f:st.f});
    }
    const kf=ko.k.f;
    base=S=>{const k=culpritIn(kf,S);if(k<0)return false;for(let i=0;i<n;i++)if(stmts[i].f(S)===(i===k))return false;return true;};
    ST=ST.filter(base);
    if(ST.length<2)return null;
  }
  let alive=ST.map((_,i)=>i);const clues=[],used=new Set();
  // ---- pistas obrigatórias do conceito (campanha) ----
  if(opts&&opts.focus&&opts.need){
    let need=opts.need;
    for(let tries=0;need>0&&tries<300;tries++){
      const kind=pickOf(R,opts.focus);const i=ri(R,0,n-1);let j=ri(R,0,n-2);if(j>=i)j++;
      const cl=TPL[kind](R,x,i,j,-1);if(!cl||!cl.f(T)||used.has(cl.t))continue;
      const after=alive.filter(q=>cl.f(ST[q]));if(after.length===alive.length||after.length<2)continue;
      cl.focus=true;clues.push(cl);used.add(cl.t);alive=after;need--;
    }
    if(need>0)return null;
  }
  const MAX=opts&&opts.max||L.max;
  while(alive.length>1&&clues.length<MAX+(opts?10:4)){
    const cands=[],step=Math.max(1,Math.floor(alive.length/1500));
    for(let tries=0;cands.length<30&&tries<120;tries++){
      const cl=genClue(R,x,mix,kinds,tot);if(!cl||used.has(cl.t))continue;
      let after=0,seen=0;for(let q=0;q<alive.length;q+=step){seen++;if(cl.f(ST[alive[q]]))after++;}
      after=after*alive.length/seen;
      if(after<alive.length&&!cands.some(o=>o.cl.t===cl.t))cands.push({cl,after});
    }
    if(!cands.length)return null;
    cands.sort((a,b)=>b.after-a.after);
    const pick=cands[Math.floor(R()*Math.max(1,Math.ceil(cands.length*L.gentle)))];
    alive=alive.filter(i=>pick.cl.f(ST[i]));clues.push(pick.cl);used.add(pick.cl.t);
  }
  if(alive.length!==1)return null;
  let keep=clues.slice();
  for(const idx of shuffled(R,clues.map((_,i)=>i))){
    if(clues[idx].focus)continue;
    const without=keep.filter(c=>c!==clues[idx]);let cnt=0;
    for(const s of ST){if(without.every(c=>c.f(s))){cnt++;if(cnt>1)break;}}
    if(cnt===1)keep=without;
  }
  keep=shuffled(R,keep);
  if(!relaxed&&(keep.length<L.min||keep.length>MAX))return null;
  const role=pickOf(R,th.roles),victim=`${role[0]} ${pickOf(R,SURN)}`;
  const c={level:L.name,lv:LEVELS.indexOf(L),title:pickOf(R,th.titles),
    intro:`${cap(victim)} foi encontrad${role[1]==="f"?"a":"o"} sem vida ${th.where}. ${["","","","Três","Quatro","Cinco"][n]} pessoas estavam por perto, cada uma sozinha num cômodo, com uma arma à mão. ${L.tip}`,
    suspects:sus,weapons:W,rooms:Rm,clues:keep,killer:{t:ko.k.t,fx:ko.k.fx,f:ko.k.f},hints:[],explain:[],ending:""};
  if(base){c.base=base;c.stmts=stmts;c.liar=true;}
  const sols=solve(c);if(sols.length!==1)return null;
  const sol=sols[0],culprit=sol.S.findIndex(p=>c.killer.f(p,sol.S));
  if(culprit<0)return null;
  c.explain=explainCase(c,sol,culprit);c.ending=endingFor(R,c,sol,culprit);
  return c;
}

function explainCase(c,sol,culprit){
  const n=c.suspects.length;let alive=buildStates(c);const rem=c.clues.map((_,i)=>i),known=new Set(),out=[];
  const facts=()=>{const f=[];for(let i=0;i<n;i++){
      const ws=new Set(alive.map(s=>s.pw[i]));if(ws.size===1&&!known.has("w"+i)){known.add("w"+i);f.push(`${c.suspects[i]} usou ${art(c.weapons[[...ws][0]])}`);}
      const rs=new Set(alive.map(s=>s.pr[i]));if(rs.size===1&&!known.has("r"+i)){known.add("r"+i);f.push(`${c.suspects[i]} esteve ${prep(c.rooms[[...rs][0]])}`);}
    }return f;};
  const tail=f=>alive.length===1?"só uma combinação sobra, e o quadro fecha por completo.":f.length?`agora é certo que ${f.join("; ")}.`:"nada é certo ainda, mas o cerco aperta.";
  if(c.base){const before=alive.length;alive=alive.filter(s=>c.base(s.S));
    out.push(`Depoimentos: o culpado apontado pela pista final mente, e todos os outros dizem a verdade. Testando cada suspeito como culpado e descartando as hipóteses contraditórias, as combinações caem de ${before} para ${alive.length}; ${tail(facts())}`);}
  while(rem.length){
    let best=-1,ba=null;
    for(const i of rem){const a=alive.filter(s=>c.clues[i].f(s.S));if(ba===null||a.length<ba.length){best=i;ba=a;}}
    rem.splice(rem.indexOf(best),1);const before=alive.length;alive=ba;
    out.push(`Pista ${best+1} (“${c.clues[best].t}”): de ${before} para ${alive.length} combinações possíveis; ${tail(facts())}`);
  }
  out.push(`Pista final (“${c.killer.t}”): só ${c.suspects[culprit]} cumpre isso, com ${c.weapons[sol.pw[culprit]].n} (${c.weapons[sol.pw[culprit]].v}) ${prep(c.rooms[sol.pr[culprit]])} (${c.rooms[sol.pr[culprit]].v}).`);
  if(c.stmts)out.push(`${c.suspects[culprit]} mentiu ao dizer “${c.stmts[culprit].t}”. Todos os outros depoimentos são verdadeiros.`);
  return out;
}
function endingFor(R,c,sol,k){
  const X=c.suspects[k],w=c.weapons[sol.pw[k]],r=c.rooms[sol.pr[k]];
  return pickOf(R,[
    `${X} achou que estar ${prep(r)} seria um álibi perfeito. Só não contava com um detetive que faz conta de cabeça.`,
    `${X} tentou esconder tudo, mas ${w.n} (peso ${w.v}) e o cômodo ${r.v} entregaram a história inteira.`,
    `Caso encerrado! ${X} vai ter muito tempo livre para revisar as contas.`,
    `${X} apostou no silêncio, mas os números falaram mais alto.`
  ]);
}
function generateCase(level,seed,opts){
  const L=LEVELS[level];
  for(let a=0;a<500;a++){
    const c=tryGenerate(L,rng((seed+a*7919)>>>0),a>=250,opts);
    if(c)return c;
  }
  throw new Error("falha ao gerar caso");
}

  if(!ok(c.sol))return{kind:"wrong"};
  const A=statesOf(c).filter(ok);
  const cons=[];if(c.base)cons.push({label:"os depoimentos, junto com a pista final",f:c.base});
  c.clues.forEach((cl,i)=>cons.push({label:`a pista ${i+1}`,num:i+1,f:cl.f}));
  let fc=forcedCells(c,rec,A);if(fc.length)return{kind:"cross",cells:fc};

    const B=A.filter(s=>cons[i].f(s.S)&&cons[j].f(s.S)),f=forcedCells(c,rec,B);

  const l=save.level,lv=save.levels[l];let rec=lv.list[lv.idx],c;
  try{c=getCase(rec);}catch(e){console.error(e);lv.list.splice(lv.idx,1);if(!lv.list.length)lv.list.push(newRec(l,{classic:l}));lv.idx=Math.min(lv.idx,lv.list.length-1);return freeView();}
  const prev=h("button",{type:"button",class:"iconbtn","aria-label":"Caso anterior",disabled:lv.idx===0,onclick:()=>{lv.idx--;persist();render();}},icon("left"));
  const next=h("button",{type:"button",class:"iconbtn","aria-label":"Próximo caso da lista",disabled:lv.idx>=lv.list.length-1,onclick:()=>{lv.idx++;persist();render();}},icon("right"));
  const code=rec.classic!=null?h("span",{class:"code static"},"Clássico"):h("button",{type:"button",class:"code",title:"Copiar código do caso",onclick:()=>{
    (navigator.clipboard?navigator.clipboard.writeText(rec.id):Promise.reject()).then(()=>toast("Código "+rec.id+" copiado"),()=>toast("Código do caso: "+rec.id));}},"#"+rec.id);
  const form=h("form",{class:"codeform",onsubmit:e=>{e.preventDefault();const err=openCode($("input",e.target).value);if(err)$(".codemsg",e.target.parentNode).textContent=err;}},
    h("input",{class:"codein",type:"text",placeholder:"Ex.: P-1K3Z9A","aria-label":"Código do caso",maxlength:"10",autocomplete:"off"}),h("button",{type:"submit",class:"btn ghost sm"},"Abrir"));
  const head=h("section",{class:"card casehead"},
    h("div",{class:"case-tools"},
      h("div",{class:"casenav"},prev,h("p",{class:"kicker"},`Caso ${lv.idx+1} de ${lv.list.length} · ${c.level} · ${c.size}×${c.size}`),next),
      h("div",{class:"casetools-r"},code,timerEl(rec),
        h("button",{type:"button",class:"btn ghost sm refresh",title:"Gerar um caso inédito neste nível",onclick:e=>newCase(l,e.currentTarget)},icon("refresh"),"Novo caso"))),
    h("h2",{},c.title),h("p",{class:"intro"},c.intro),
    h("details",{class:"codebox"},h("summary",{},"Jogar um caso por código"),form,h("p",{class:"codemsg small"},"")));
  const ctx={label:`${LV[l].name} ${rec.classic!=null?"(clássico)":"#"+rec.id}`,
    actions:[h("button",{type:"button",class:"btn refresh",onclick:e=>newCase(l,e.currentTarget)},icon("refresh"),"Novo caso"),
      l<LV.length-1?h("button",{type:"button",class:"btn ghost",onclick:()=>{save.level=l+1;persist();render();scrollTop();}},"Subir de nível →"):null]};
  return[levelNav(),head,...caseBoard(ctx,c,rec)];
}
function achView(){
  const got=ACH.filter(a=>save.ach[a.id]).length;
  return[h("section",{class:"card"},h("p",{class:"kicker"},"Conquistas"),h("h2",{},`${got} de ${ACH.length} desbloqueadas`),
    h("div",{class:"pbar"},h("i",{style:`width:${Math.round(got/ACH.length*100)}%`})),
    h("div",{class:"achs"},ACH.map(a=>{const on=!!save.ach[a.id];return h("div",{class:"ach"+(on?" on":"")},
      h("span",{class:"medal","aria-hidden":"true"},a.sym),h("div",{},h("b",{},a.name),h("span",{class:"mute small"},a.d),on?h("span",{class:"when"},`Desbloqueada em ${dkBR(save.ach[a.id])}`):null));}))),
    h("section",{class:"card"},h("h3",{},"Seus números"),h("ul",{class:"statl"},
      h("li",{},"Casos resolvidos: ",h("b",{},totals().solved)),h("li",{},"Estrelas: ",h("b",{},totals().stars)),
      h("li",{},"Capítulos da campanha: ",h("b",{},`${CHAPTERS.filter((_,k)=>campSolved(k)).length}/${CHAPTERS.length}`)),
      h("li",{},"Casos do dia resolvidos: ",h("b",{},save.daily.done.length)),h("li",{},"Sequência atual: ",h("b",{},`${streak()} dia(s)`))))];
}
function render(){
  renderTop();VIEW=null;refreshSide=()=>{};redrawWork=()=>{};
  let body;
  try{
    if(save.mode==="camp")body=save.camp.open!=null&&chapterOpen(save.camp.open)?campCase(save.camp.open):campMap();
    else if(save.mode==="daily")body=dailyView();
    else if(save.mode==="ach")body=achView();
    else body=freeView();
  }catch(e){console.error(e);body=[h("section",{class:"card"},h("p",{},"Algo deu errado ao montar este caso."))];}
  $("#app").replaceChildren(...[modeNav(),save.mode==="ach"?null:howTo(),...body].filter(Boolean));
  if(!save.seen){save.seen=true;persist();}
}
setInterval(()=>{const el=$("#timer");if(!el||document.hidden||!VIEW||VIEW.solved)return;VIEW.t=(VIEW.t||0)+1;el.textContent=fmt(VIEW.t);if(VIEW.t%5===0)persist();},1000);
window.addEventListener("pagehide",persist);
$("#wipe").addEventListener("click",()=>{
  if(!confirm("Apagar todo o progresso e recomeçar?"))return;
  try{localStorage.removeItem(KEY);localStorage.removeItem(OLD);}catch(e){}
  cache.clear();for(const k in hist)delete hist[k];
  save=loadSave();render();
});
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;const b=$("#install");if(b)b.hidden=false;});
const ib=$("#install");if(ib)ib.addEventListener("click",()=>{if(installEvt){installEvt.prompt();installEvt=null;ib.hidden=true;}});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();

</script>
</body>
